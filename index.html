<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forever Love - Our Journey</title>
    <!-- 引入可愛手寫風格字體 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
            font-family: 'ZCOOL KuaiLe', 'Noto Serif TC', sans-serif;
            color: #fff;
        }

        /* 滿天星空背景 */
        .night-sky {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 流星效果 */
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(-45deg, rgba(255,255,255,1), rgba(0,0,255,0));
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
            animation: shoot 3s infinite linear;
            z-index: 2;
            opacity: 0;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-1000px) translateY(1000px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* 內容容器 */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
            color: #ffccd5;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #b0c4de;
            letter-spacing: 1px;
        }

        /* 倒數計時卡片 */
        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }

        .time-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-size: 1.8rem;
            color: #ff99a8;
            font-weight: bold;
        }

        .time-label {
            font-size: 0.85rem;
            color: #ddd;
            margin-top: 5px;
        }

        /* 跑馬燈語錄 */
        .quote-box {
            font-size: 1.25rem;
            color: #fffaf0;
            min-height: 40px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            transition: opacity 1s ease-in-out;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="night-sky" id="sky"></div>

    <div class="content-container">
        <h1>Our Special Journey</h1>
        <div class="subtitle">每一刻，都有妳陪伴的浪漫時光</div>

        <div class="countdown-box" id="countdown">
            <div class="time-item">
                <span class="time-number" id="days">00</span>
                <span class="time-label">天</span>
            </div>
            <div class="time-item">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">小時</span>
            </div>
            <div class="time-item">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">分</span>
            </div>
            <div class="time-item">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">秒</span>
            </div>
        </div>

        <div class="quote-box" id="quoteDisplay">載入專屬回憶中...</div>
    </div>

    <script>
        // 1. 生成滿天繁星
        const sky = document.getElementById('sky');
        const starCount = 120;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 1}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            sky.appendChild(star);
        }

        // 2. 生成流星
        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            star.style.top = `${Math.random() * 50}%`;
            star.style.left = `${Math.random() * 100 + 50}%`;
            star.style.width = `${Math.random() * 80 + 80}px`;
            star.style.animationDuration = `${Math.random() * 1.5 + 1.5}s`;
            sky.appendChild(star);
            setTimeout(() => { star.remove(); }, 3000);
        }
        setInterval(createShootingStar, 2500);

        // 3. 倒數計時（可自行修改起始日期）
        const startDate = new Date('2026-01-01T00:00:00');
        function updateCountdown() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. 跑馬燈 6 句甜甜語錄
        const quotes = [
            "「星空再美，也比不上妳眼裡的溫柔。」",
            "「謝謝妳總是把最棒的驚喜帶進我的日常。」",
            "「時間一直走，我們一直愛。」",
            "「和小岳一起過的每一秒，都是賺到的甜。」",
            "「有閨密和妳在身邊，這條路發光也發熱。」",
            "「願所有的美好，都剛好如期而至。」"
        ];
        let currentQuoteIndex = 0;
        const quoteDisplay = document.getElementById('quoteDisplay');

        function rotateQuotes() {
            quoteDisplay.style.opacity = 0;
            setTimeout(() => {
                quoteDisplay.innerText = quotes[currentQuoteIndex];
                quoteDisplay.style.opacity = 1;
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
            }, 1000);
        }
        rotateQuotes();
        setInterval(rotateQuotes, 5000);
    </script>
</body>
</html>
