<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forever Love - Our Journey</title>
    <!-- 引入原本的字型與手寫字體 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Caveat:wght@700&family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            color: #fff;
        }

        /* 滿天星空背景 */
        .night-sky {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 流星效果 */
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(-45deg, rgba(255,255,255,1), rgba(0,0,255,0));
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
            animation: shoot 3s infinite linear;
            z-index: 2;
            opacity: 0;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-1000px) translateY(1000px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* 內容容器 */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            font-family: 'Caveat', cursive;
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
        }

        .subtitle {
            font-size: 0.95rem;
            margin-bottom: 25px;
            color: #b0c4de;
            letter-spacing: 1px;
        }

        /* 倒數計時卡片 (維持原本大數字美感) */
        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .days-number {
            font-size: 4rem;
            color: #fff;
            font-weight: bold;
            font-family: 'Caveat', cursive;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .time-detail {
            font-size: 0.95rem;
            color: #d1d5db;
            letter-spacing: 1px;
        }

        /* 跑馬燈語錄：維持妳要的內容，字型改為可愛手寫體 */
        .quote-box {
            font-size: 1.2rem;
            color: #fffaf0;
            min-height: 45px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            transition: opacity 1s ease-in-out;
            max-width: 500px;
            line-height: 1.5;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <div class="night-sky" id="sky"></div>

    <div class="content-container">
        <h1>OUR JOURNEY</h1>
        <div class="subtitle">專屬於我們的甜蜜時光</div>

        <div class="countdown-box">
            <div class="days-number" id="daysCount">0</div>
            <div class="time-detail" id="timeDetail">已經一起度過了 0 天 0 小時 0 分鐘 0 秒</div>
        </div>

        <div class="quote-box" id="quoteDisplay">載入專屬回憶中...</div>
    </div>

    <script>
        // 1. 生成滿天繁星
        const sky = document.getElementById('sky');
        const starCount = 120;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 1}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            sky.appendChild(star);
        }

        // 2. 生成流星
        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            star.style.top = `${Math.random() * 50}%`;
            star.style.left = `${Math.random() * 100 + 50}%`;
            star.style.width = `${Math.random() * 80 + 80}px`;
            star.style.animationDuration = `${Math.random() * 1.5 + 1.5}s`;
            sky.appendChild(star);
            setTimeout(() => { star.remove(); }, 3000);
        }
        setInterval(createShootingStar, 2500);

        // 3. 倒數計時（設定為 2025年12月17日上午11點3分）
        const startDate = new Date('2025-12-17T11:03:00');
        function updateCountdown() {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('daysCount').innerText = days;
            document.getElementById('timeDetail').innerText = `已經一起度過了 ${days} 天 ${hours} 小時 ${minutes} 分鐘 ${seconds} 秒`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. 跑馬燈甜甜語錄（使用妳提供的原汁原味內容）
        const quotes = [
            "✨ 2025.12.17 我們的故事正式開始 ✨",
            "✨ 這麼久了 我 還是喜歡你 ✨",
            "✨ 哥哥的兔兔最乖最可愛啦 ✨",
            "✨ 哥哥我要抱抱嘛 ✨",
            "✨ 我的寶貝兔兔最厲害啦 ✨",
            "✨ 兔兔的傻狐狸哥哥怎麼可以這麼甜呀 ✨"
        ];
        let currentQuoteIndex = 0;
        const quoteDisplay = document.getElementById('quoteDisplay');

        function rotateQuotes() {
            quoteDisplay.style.opacity = 0;
            setTimeout(() => {
                quoteDisplay.innerText = quotes[currentQuoteIndex];
                quoteDisplay.style.opacity = 1;
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
            }, 1000);
        }
        rotateQuotes();
        setInterval(rotateQuotes, 5000);
    </script>
</body>
</html>
