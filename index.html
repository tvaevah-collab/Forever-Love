<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forever Love - Our Journey</title>
    <!-- 引入浪漫手寫字體 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Caveat:wght@600;700&family=Long+Cang&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            color: #fff;
        }

        /* 滿天星空背景 */
        .night-sky {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 流星效果 */
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(-45deg, rgba(255,255,255,1), rgba(0,0,255,0));
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
            animation: shoot 3s infinite linear;
            z-index: 2;
            opacity: 0;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-1000px) translateY(1000px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* 分散在空中、各自會動的浪漫語錄 */
        .floating-marquee {
            position: absolute;
            font-family: 'Long Cang', cursive;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
            z-index: 5;
            white-space: nowrap;
            letter-spacing: 2px;
            animation: wanderAround 8s infinite ease-in-out alternate;
        }

        /* 讓每一句都在自己的位置上有靈動的飄動感 */
        @keyframes wanderAround {
            0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            50% { transform: translate(15px, -12px) scale(1.05); opacity: 1; }
            100% { transform: translate(-10px, 10px) scale(0.98); opacity: 0.8; }
        }

        /* 內容容器 (正中間的倒數計時) */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            font-family: 'Caveat', cursive;
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
        }

        .subtitle {
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #b0c4de;
            letter-spacing: 1px;
        }

        .days-number {
            font-size: 4.5rem;
            color: #fff;
            font-weight: bold;
            font-family: 'Caveat', cursive;
            line-height: 1;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .time-detail {
            font-size: 0.95rem;
            color: #d1d5db;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="night-sky" id="sky"></div>

    <!-- 分散在空中、各自會動的浪漫語錄 -->
    <div class="floating-marquee" style="top: 10%; left: 8%; animation-duration: 7s;">✨ 2025.12.17 我們的故事正式開始 ✨</div>
    <div class="floating-marquee" style="top: 18%; right: 8%; animation-duration: 9s;">✨ 這麼久了 我 還是喜歡你 ✨</div>
    <div class="floating-marquee" style="bottom: 18%; left: 8%; animation-duration: 8s;">✨ 哥哥的兔兔最乖最可愛啦 ✨</div>
    <div class="floating-marquee" style="bottom: 10%; right: 8%; animation-duration: 6s;">✨ 哥哥我要抱抱嘛 ✨</div>
    <div class="floating-marquee" style="top: 45%; left: 5%; animation-duration: 10s;">✨ 我的寶貝兔兔最厲害啦 ✨</div>
    <div class="floating-marquee" style="top: 45%; right: 5%; animation-duration: 7.5s;">✨ 兔兔的傻狐狸哥哥怎麼可以這麼甜呀 ✨</div>

    <div class="content-container">
        <div class="countdown-box">
            <h1>OUR JOURNEY</h1>
            <div class="subtitle">專屬於我們的甜蜜時光。依舊心岳你</div>
            <div class="days-number" id="daysCount">0</div>
            <div class="time-detail" id="timeDetail">已經一起度過了 0 天 0 小時 0 分鐘 0 秒</div>
        </div>
    </div>

    <script>
        // 1. 生成滿天繁星
        const sky = document.getElementById('sky');
        const starCount = 120;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 1}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            sky.appendChild(star);
        }

        // 2. 生成流星
        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');
            star.style.top = `${Math.random() * 50}%`;
            star.style.left = `${Math.random() * 100 + 50}%`;
            star.style.width = `${Math.random() * 80 + 80}px`;
            star.style.animationDuration = `${Math.random() * 1.5 + 1.5}s`;
            sky.appendChild(star);
            setTimeout(() => { star.remove(); }, 3000);
        }
        setInterval(createShootingStar, 2500);

        // 3. 倒數計時（2025年12月17日上午11點3分）
        const startDate = new Date('2025-12-17T11:03:00');
        function updateCountdown() {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('daysCount').innerText = days;
            document.getElementById('timeDetail').innerText = `已經一起度過了 ${days} 天 ${hours} 小時 ${minutes} 分鐘 ${seconds} 秒`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
